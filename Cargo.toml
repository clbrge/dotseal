[package]
name = "dotseal"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"
description = "Seal individual dotenv values with scope-bound keys (AES-256-GCM, AAD-bound to (scope, name))"
repository = "https://github.com/clbrge/dotseal"
homepage = "https://github.com/clbrge/dotseal"
documentation = "https://docs.rs/dotseal"
readme = "README.md"
keywords = ["dotenv", "secrets", "encryption", "aes-gcm", "config"]
categories = ["command-line-utilities", "cryptography", "config"]

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
indexmap = "2.2"
libc = "0.2"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1.7"

[dev-dependencies]
proptest = "1.4"
tempfile = "3.10"
